bio: |
  Η έρευνά μου κινείται στο σημείο όπου η στατιστική και η μηχανική μάθηση
  συναντούν τα εκπαιδευτικά δεδομένα, με στόχο τη μετατροπή των δεδομένων
  που ήδη συγκεντρώνει το εκπαιδευτικό σύστημα σε τεκμηρίωση για τη χάραξη
  πολιτικής. Παράλληλα υπηρετώ στη δημόσια εκπαιδευτική διοίκηση, όπου
  ασχολούμαι με τον ψηφιακό μετασχηματισμό διαδικασιών και τη διαχείριση
  ευρωπαϊκών προγραμμάτων.

